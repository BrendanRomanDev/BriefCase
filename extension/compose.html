<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BriefCase — Send with context</title>
<style>
  :root {
    --ink: #1a202c;
    --muted: #64748b;
    --border: #cbd5e1;
    --accent: #2b6cb0;
    --bg: #fafafa;
    --pane: #ffffff;
    --err: #c53030;
    --ok: #2f855a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    padding: 18px;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .source {
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .source .label {
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 11px;
    margin-right: 6px;
  }
  .source .title {
    color: var(--ink);
    font-weight: 500;
  }
  .source .url {
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }
  label {
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 2px;
  }
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    resize: vertical;
    background: var(--pane);
    color: var(--ink);
  }
  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  .divider {
    border: 0;
    border-top: 1px dashed var(--border);
    position: relative;
    margin: 6px 0 2px 0;
  }
  .divider-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-top: 2px;
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 4px;
  }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #send {
    background: var(--accent);
    color: white;
  }
  #cancel {
    background: #e2e8f0;
    color: var(--ink);
  }
  button:hover { filter: brightness(1.05); }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .status {
    margin-left: auto;
    font-size: 12px;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .hint {
    color: var(--muted);
    font-size: 11px;
  }
  .selection-block textarea { min-height: 120px; }
  .context-block textarea { min-height: 110px; }
</style>
</head>
<body>
  <h1>Send to BriefCase with context</h1>

  <div class="source" id="source-preview">
    <div><span class="label">Source</span> <span class="title" id="source-title">—</span></div>
    <div class="url" id="source-url">—</div>
  </div>

  <div class="selection-block">
    <label for="content">Captured content</label>
    <textarea id="content" spellcheck="false" placeholder="The captured text appears here. Edit freely before sending."></textarea>
  </div>

  <hr class="divider" />
  <span class="divider-label">---- additional context ----</span>

  <div class="context-block">
    <label for="context">Additional context (optional)</label>
    <textarea id="context" placeholder="Why are you capturing this? What's the ask? What's the deadline? Which initiative does it relate to?" autofocus></textarea>
  </div>

  <div class="row">
    <button id="send">Send (⌘↩)</button>
    <button id="cancel">Cancel (Esc)</button>
    <span id="status" class="status hint"></span>
  </div>

  <script src="compose.js"></script>
</body>
</html>
