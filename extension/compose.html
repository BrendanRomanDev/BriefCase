<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BriefCase — Send to queue</title>
<link rel="stylesheet" href="themes.css">
<script src="theme.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    margin: 0;
    padding: 18px;
    background: var(--bg);
    color: var(--ink);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: background 120ms ease, color 120ms ease;
  }
  h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
  }
  .source-title-block {
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .source-title-block .label {
    font-weight: 600;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10px;
    margin-right: 6px;
  }
  .field-label {
    font-weight: 600;
    font-size: 12px;
    margin-bottom: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--ink);
  }
  .label-hint {
    font-weight: 500;
    font-size: 11px;
    color: var(--muted);
  }
  .label-hint.ok { color: var(--ok); }
  .label-hint.warn { color: var(--warn); }
  input[type="text"], textarea {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    background: var(--pane);
    color: var(--ink);
  }
  input[type="text"].url {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
  }
  textarea {
    resize: vertical;
  }
  input[type="text"]:focus, textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    border-color: var(--accent);
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 6px 0 -4px 0;
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .row {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 6px;
  }
  button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  #send {
    background: var(--accent);
    color: var(--bg);
  }
  #cancel {
    background: var(--pane);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  #draft-now {
    background: var(--pane);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  .draft-result {
    margin-top: 4px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--pane);
  }
  .draft-result .draft-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .draft-result .draft-title {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
  }
  .draft-result .draft-meta {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }
  .draft-result textarea {
    min-height: 110px;
    margin-bottom: 8px;
  }
  .draft-result .draft-actions {
    display: flex;
    gap: 8px;
  }
  .draft-result button {
    padding: 6px 12px;
    font-size: 12px;
  }
  #draft-copy {
    background: var(--accent);
    color: var(--bg);
  }
  #draft-redraft, #draft-hide {
    background: var(--pane);
    color: var(--ink);
    border: 1px solid var(--border);
  }
  button:hover { filter: brightness(1.05); }
  button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }
  .status {
    margin-left: auto;
    font-size: 12px;
  }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .hint { color: var(--muted); font-size: 11px; }
  .content-block textarea { min-height: 110px; }
  .context-block textarea { min-height: 100px; }
  .flags-block {
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .flags-block .group-label {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 8px;
    display: block;
  }
  .flags-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 14px;
  }
  .flag-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    margin-bottom: 0;
  }
  .flag-row input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .epic-block {
    margin-top: 10px;
    display: none;
  }
  .epic-block.visible { display: block; }
  .epic-block label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-weight: 600;
    margin-bottom: 4px;
    display: block;
  }
  .epic-block input {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
  }
</style>
</head>
<body>
  <h1>Send to BriefCase</h1>

  <div class="source-title-block" id="source-title-block">
    <span class="label">Page</span>
    <span id="source-title">—</span>
  </div>

  <div class="url-block">
    <label for="source-url" class="field-label">
      Source link
      <span class="label-hint" id="url-hint">&nbsp;</span>
    </label>
    <input type="text" id="source-url" class="url" spellcheck="false" autocomplete="off" placeholder="https://..." />
    <div class="hint">Edit if you want a more specific anchor. On Google Chat: click <strong>More actions</strong> on the message → <strong>Copy message link</strong>, then paste here (or we'll auto-paste on open).</div>
  </div>

  <div class="flags-block">
    <span class="group-label">What does this need?</span>
    <div class="flags-grid">
      <label class="flag-row">
        <input type="checkbox" id="flag-brain-dump" />
        <span>Brain dump (postpone for later)</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-jira" />
        <span>Jira ticket</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-code-research" />
        <span>Code research / repo context</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-pr-review" />
        <span>PR review</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-search-around" />
        <span>Search around (vault + inbox)</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-meeting" />
        <span>Schedule a meeting</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-reply" />
        <span>This will need a reply</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-decision" />
        <span>Decision (file under an initiative)</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-person" />
        <span>Add / update a person</span>
      </label>
      <label class="flag-row">
        <input type="checkbox" id="flag-auto-file" />
        <span>Just file it (Kit's call)</span>
      </label>
    </div>
    <div class="epic-block" id="epic-block">
      <label for="epic-hint" class="field-label">Epic hint (Jira key)</label>
      <input type="text" id="epic-hint" placeholder="e.g. THRIV-13413" autocomplete="off" spellcheck="false" />
    </div>
    <div class="epic-block" id="meeting-block">
      <label for="meeting-attendees" class="field-label">Attendees (comma-separated emails)</label>
      <input type="text" id="meeting-attendees" placeholder="e.g. dave.shapiro@thriveworks.com, soham.trivedi@thriveworks.com" autocomplete="off" spellcheck="false" />
    </div>
    <div class="epic-block" id="person-block">
      <label for="person-name" class="field-label">Person name (optional - Kit will infer from content if blank)</label>
      <input type="text" id="person-name" placeholder="e.g. Dave Shapiro" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div class="content-block">
    <label for="content" class="field-label">Captured content</label>
    <textarea id="content" spellcheck="false" placeholder="The captured text appears here. Edit freely before sending."></textarea>
  </div>

  <div class="divider">additional context</div>

  <div class="context-block">
    <label for="context" class="field-label">Additional context (optional)</label>
    <textarea id="context" placeholder="Why are you capturing this? What's the ask? What's the deadline? Which initiative does it relate to?"></textarea>
  </div>

  <div class="row">
    <button id="send">Send (⌘↩)</button>
    <button id="draft-now" title="Draft a reply in your voice via the sidecar (uses claude -p, ~5-10s)">Draft now (⌘D)</button>
    <button id="cancel">Cancel (Esc)</button>
    <span id="status" class="status hint"></span>
  </div>

  <div id="draft-result" class="draft-result" hidden>
    <div class="draft-header">
      <span class="draft-title">Drafted reply</span>
      <span id="draft-meta" class="draft-meta"></span>
    </div>
    <textarea id="draft-text" spellcheck="false"></textarea>
    <div class="draft-actions">
      <button id="draft-copy">Copy to clipboard</button>
      <button id="draft-redraft">Re-draft</button>
      <button id="draft-hide">Hide</button>
    </div>
  </div>

  <script src="compose.js"></script>
</body>
</html>
