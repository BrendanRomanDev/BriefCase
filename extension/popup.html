<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BriefCase</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    width: 260px;
    margin: 0;
    padding: 14px 16px;
    color: #222;
    background: #fafafa;
  }
  h1 { font-size: 14px; margin: 0 0 10px 0; }
  .health {
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    background: #f1f5f9;
    border: 1px solid #e2e8f0;
    margin-bottom: 10px;
  }
  .ok { color: #2f855a; }
  .err { color: #c53030; }
  a {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: #2b6cb0;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>BriefCase</h1>
  <div id="health" class="health">Checking sidecar...</div>
  <a id="options-link" href="#">Open options</a>
  <script src="popup.js"></script>
</body>
</html>
