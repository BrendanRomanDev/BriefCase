<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BriefCase</title>
<link rel="stylesheet" href="themes.css">
<script src="theme.js"></script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    width: 260px;
    margin: 0;
    padding: 14px 16px;
    color: var(--ink);
    background: var(--bg);
    transition: background 120ms ease, color 120ms ease;
  }
  h1 { font-size: 14px; margin: 0 0 10px 0; color: var(--ink); }
  .health {
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--pane);
    border: 1px solid var(--border);
    margin-bottom: 10px;
    color: var(--ink);
  }
  .ok { color: var(--ok); }
  .err { color: var(--err); }
  a {
    display: inline-block;
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <h1>BriefCase</h1>
  <div id="health" class="health">Checking sidecar...</div>
  <a id="options-link" href="#">Open options</a>
  <script src="popup.js"></script>
</body>
</html>
