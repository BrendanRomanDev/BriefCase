database_path: ~/.briefcase/briefcase.db
obsidian_vault: ~/Notes/ThriveNotes
user_profile: ~/.briefcase/user_profile.yaml
backup_dir: ~/.briefcase/backups

features:
  printing: true
  repo_integration: true

printer:
  type: "network"
  host: "192.168.68.99"
  port: 9100
  width_mm: 72
  width_px: 576

# Sidecar HTTP bridge (used by the Chrome extension).
# See briefcase/sidecar/README.md. Override the port here or via
# the BRIEFCASE_SIDECAR_PORT env variable.
sidecar:
  port: 8989

# Tangent dispatch (WezTerm-only). When `auto`, Kit only spawns tangents
# if `wezterm` is on PATH AND a tangent SKILL.md is installed. Set to
# `false` to disable the feature; `true` to force on (will fail gracefully
# if WezTerm isn't running). When disabled, auto-run items fall back to
# Kit's inline resolution behavior.
tangent:
  enabled: auto
  skill_work: tangent           # for action-flagged auto-run items
  skill_research: tangent-teach  # for research-only auto-run items
  attach_dropdown_limit: 10

# External systems. Used by external_refs to derive canonical URLs from
# short keys (e.g. 'THRIV-13413' -> 'https://.../browse/THRIV-13413').
integrations:
  jira:
    base_url: https://thriveworks.atlassian.net
