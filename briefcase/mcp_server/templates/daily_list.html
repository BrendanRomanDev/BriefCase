<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: white;
            width: 576px;
            padding: 0;
            margin: 0;
        }
        .checklist-container {
            background: white;
            padding: 15px 10px 40px 10px;
        }
        .perforation {
            background: repeating-linear-gradient(
                to right, #000 0, #000 6px, transparent 6px, transparent 12px
            );
            height: 3px;
            margin: 5px 0;
        }
        .title {
            text-align: center;
            padding: 15px 0 10px 0;
        }
        .title h1 {
            font-size: 36px;
            font-weight: bold;
            color: #000;
            margin: 0;
        }
        .dashed-line {
            border-top: 3px dashed #666;
            margin: 10px 0 15px 0;
        }
        .task-list { padding: 0 20px; }
        .task-item {
            display: flex;
            align-items: flex-start;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        .checkbox {
            font-size: 28px;
            margin-right: 12px;
            flex-shrink: 0;
            color: #000;
        }
        .task-text {
            font-size: 28px;
            font-weight: normal;
            color: #000;
            word-wrap: break-word;
            flex: 1;
        }
        .bottom-perforation { margin-top: 15px; }
    </style>
</head>
<body>
    <div class="checklist-container">
        <div class="perforation"></div>
        <div class="title"><h1>{{ title }}</h1></div>
        <div class="dashed-line"></div>
        <div class="task-list">
            {% for task in tasks %}
                {% set stripped = task.strip() %}
                {% if stripped == '' %}
                    <div style="margin: 8px 0;"></div>
                {% else %}
                    <div class="task-item">
                        <span class="checkbox">☐</span>
                        <span class="task-text">{{ task }}</span>
                    </div>
                {% endif %}
            {% endfor %}
        </div>
        <div class="perforation bottom-perforation"></div>
    </div>
</body>
</html>
